<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Styled Map</title>
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; color: #1f2933; background: #fff; }
    main { max-width: 960px; margin: 0 auto; padding: 16px; }
    main.locked { visibility: hidden; }
    h1 { font-size: 1.5rem; margin: 0 0 12px; }
    #map { width: 100%; height: 60vh; min-height: 320px; border-radius: 8px; }
    .profile { margin: 16px 0 0; }
    .profile img { display: block; width: 100%; height: auto; }
    #gate { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 24px; text-align: center; background: #fff; }
    #gate.show { display: flex; }
    #gate button { font: inherit; padding: 8px 16px; }
  </style>
</head>
<body>
  <main id="content" class="locked">
    <h1>Today's Tour Route</h1>
    <div id="map"></div>
    <figure class="profile">
      <img src="elevation.png" alt="ルートの標高断面図(湘南江の島から大船まで)">
    </figure>
    <figure class="profile">
      <img src="viewtabi.jpeg" alt="参考画像">
    </figure>
    <figure class="profile">
      <img src="nichiren-ninsho.png" alt="日蓮と忍性の肖像">
    </figure>
    <figure class="profile">
      <img src="ryukoji.jpg" alt="龍口寺">
    </figure>
    <figure class="profile">
      <img src="enoden-route.gif" alt="江ノ電の路線図">
    </figure>
    <figure class="profile">
      <img src="jinriki.jpg" alt="人力車">
    </figure>
  </main>

  <div id="gate" class="show">
    <p id="gateMsg">認証中…</p>
    <button id="retry" type="button" hidden>入力し直す</button>
  </div>

  <script>
    const mapStyle = [
      { featureType: "poi.business", stylers: [{ visibility: "off" }] },
      { featureType: "poi.park", elementType: "labels.text", stylers: [{ visibility: "off" }] }
    ];

    const content = document.getElementById("content");
    const gate = document.getElementById("gate");
    const gateMsg = document.getElementById("gateMsg");
    const retry = document.getElementById("retry");
    let authFailed = false;

    // ページ全体を隠して、メッセージだけ表示する
    function lock(msg, canRetry) {
      content.classList.add("locked");
      gateMsg.textContent = msg;
      retry.hidden = !canRetry;
      gate.classList.add("show");
    }

    // 認証に成功したときだけ、ページを表示する
    function unlock() {
      if (authFailed) return;
      content.classList.remove("locked");
      gate.classList.remove("show");
    }

    retry.addEventListener("click", () => location.reload());

    function initMap() {
      const map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 35.3200, lng: 139.5400 }, // 鎌倉市全体の中心付近
        zoom: 12,
        styles: mapStyle
      });
      // 地図が読み込めたら、少し待ってからページを表示(認証エラーが来ていないか確認する)
      google.maps.event.addListenerOnce(map, "tilesloaded", () => setTimeout(unlock, 1000));
    }
    window.initMap = initMap;

    // キーが間違っている(または許可外のURL)と、Googleがこの関数を呼ぶ
    window.gm_authFailure = function () {
      authFailed = true;
      try { localStorage.removeItem("gmapsKey"); } catch (e) {}
      lock("APIキーが正しくないため、ページを表示できません。", true);
    };

    // APIキーはコードに書かず、この端末のブラウザにだけ保存する
    function getKey() {
      let key = null;
      try { key = localStorage.getItem("gmapsKey"); } catch (e) {}
      if (!key) {
        key = (prompt("Google Maps APIキーを入力してください") || "").trim();
        if (key) { try { localStorage.setItem("gmapsKey", key); } catch (e) {} }
      }
      return key;
    }

    
    const apiKey = getKey();
    if (!apiKey) {
      lock("APIキーが入力されていないため、ページを表示できません。", true);
    } else {
      const s = document.createElement("script");
      s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(apiKey) + "&callback=initMap&loading=async";
      s.async = true;
      s.onerror = () => lock("地図を読み込めませんでした。ネットワークを確認してください。", true);
      document.head.appendChild(s);
    }
  </script>
</body>
</html>
